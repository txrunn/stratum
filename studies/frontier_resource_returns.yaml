# #7B2 Frontier extraction returns — Luxemburg primitive-accumulation lens.
# Rationale: HETERODOX_STRATEGIES.md § "#7 Layer B2".
#
# Descriptive-only: multi-year residual returns of frontier extraction names
# vs a broad commodity peer basket. Not a p-value hunt — the point is to see
# whether the Luxemburg-lens thesis produces persistent residual returns as
# accumulation exhausts existing frontiers. Small N per class, long horizon.

name: frontier_resource_returns
# See reserve_army_regime_earnings_conditioning.yaml for the field's role.
# Luxemburg's ongoing-primitive-accumulation thesis (HETERODOX_STRATEGIES.md
# § 7B2) is luxemburgism per META.md § Framework Roster, not orthodox-marxism.
framework: luxemburgism
hypothesis: >
  New extraction frontiers open when accumulation exhausts existing ones.
  Names newly assigned the frontier_extraction_thesis label show
  persistent residual returns versus a broad commodity peer basket over a
  multi-year horizon as the frontier thesis strengthens (thesis_reaffirmed)
  rather than reverses (thesis_downgraded).
universe: universe_commodities.frontier_resources

descriptive_only: true              # no EM/small-cap factor model that fits these
peer_basket: commodity_broad        # DBC baseline; report residual-of-residual

# Event = the date a frontier_extraction_thesis label is assigned to a name.
# One event per name × label-version combination; typically a handful per year
# per name as thesis strengthens/weakens.
events_source: label_events
event_filter:
  label_class: frontier_extraction_thesis

window: {pre: -63, post: 252}       # ~3mo lookback, ~1yr forward
window_unit: trading_days   # ARCHITECTURE.md quant/calendar.py convention; see semantic/mllm_bridge.py
estimation: null

classes:
  - thesis_first_assigned            # inaugural thesis assignment
  - thesis_reaffirmed                # strengthened without break
  - thesis_downgraded                # explicit downgrade in label

min_events_per_class: 3             # very small — descriptive report only
allow_lookahead: false
classifier_version: frontier_extraction_thesis@v1

# Report style: descriptive tables per-name with peer-basket residuals over
# horizon buckets (30d, 90d, 252d). No pooled t-statistic; the exploratory
# flag is implicit in descriptive_only=true.
